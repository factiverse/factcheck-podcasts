worker_processes auto; # this will automatically set the worker processes based on the number of CPU cores.

events {
    worker_connections 100; # this is the maximum number of connections that each worker process can handle.
}

http {
    upstream api {
        server backend:8000;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 8080;
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            root /var/www/react;    
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $http_host;
        }

        location /media/ {
            alias /var/www/media/;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
            expires max;
            log_not_found off;
        }
    }
}
