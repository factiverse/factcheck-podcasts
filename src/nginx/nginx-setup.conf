upstream api {
    server backend:8000;
}

server {
    listen 8080;
    client_max_body_size 50M;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    sendfile on;
    sendfile_max_chunk 512k;

    location / {
        root /var/www/react;    
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $http_host;
    }

    location /media/ {
        alias /var/www/media/;
    }

}
