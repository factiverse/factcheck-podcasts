version: '3'

services:
  backend:
    build:
      context: ./backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8888 --timeout 600
    volumes:
      - ./backend/db.sqlite3:/backend/db.sqlite3
      - ./media:/media
    ports:
      - "8888:8888"
  frontend:
    build:
      context: ./frontend
    volumes:
      - react_build:/frontend/build
  nginx:
    image: nginx:latest
    ports:
      - 80:8080
    volumes:
      - ./nginx/nginx-setup.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
      - react_build:/var/www/react
      - ./media:/var/www/media
    depends_on:
      - backend
      - frontend
volumes:
  react_build:
  media: